<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BoxVerse Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>

  <body class="login-page">
    <!--  LOGO  -->

    <div class="top-logo">
      <div class="logo-circle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          fill="currentColor"
          class="bi bi-box-seam d-inline-block align-text-top"
          viewBox="0 0 16 16"
        >
          <path
            d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"
          />
        </svg>
      </div>

      <h1>BOX VERSE</h1>
    </div>

    <!--  MAIN  -->

    <div class="main-container">
      <!-- SIGNUP -->

      <form id="signupForm" class="auth-box">
        <h2>Create Account</h2>

        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="signupEmail"
            placeholder="name@example.com"
          />

          <label>Email address</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="signupPassword"
            placeholder="Password"
          />

          <label>Password</label>
        </div>

        <button class="simple-btn-primary auth-btn" type="submit">
          Sign Up
        </button>

        <p id="signupMessage" class="message-text"></p>
      </form>

      <hr />

      <!-- LOGIN -->

      <form id="loginForm" class="auth-box">
        <h2>Login</h2>

        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="loginEmail"
            placeholder="name@example.com"
          />

          <label>Email address</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="loginPassword"
            placeholder="Password"
          />

          <label>Password</label>
        </div>

        <button class="simple-btn-primary auth-btn" type="submit">Login</button>

        <p id="loginMessage" class="message-text"></p>
      </form>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/login.js"></script>
  </body>
</html>
