<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Customize Box</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/customize.css" />
  </head>

  <body class="customize-page">
    <!--  NAVBAR  -->

    <nav class="navbar simple-navbar sticky-top">
      <div class="container-fluid">
        <button onclick="history.back()" class="back-btn">← Back</button>
      </div>
    </nav>

    <!--  MAIN  -->

    <div class="customize-container">
      <!--  LIVE BOX  -->

      <div class="preview-container">
        <div id="liveBox" class="live-box">
          <!-- TOP TAPE -->
          <div class="box-top"></div>

          <!-- DESIGN -->
          <div id="designLayer" class="design-layer"></div>

          <!-- CATEGORY -->
          <div id="boxTag" class="box-tag"></div>
        </div>
      </div>

      <!--  OPTIONS  -->

      <div class="options-container">
        <!-- CATEGORY -->

        <div class="custom-section">
          <h3>Category</h3>

          <p id="categoryText">Gaming Box</p>
        </div>

        <!-- COLOR -->

        <div class="custom-section">
          <h3>Select Color</h3>

          <label>
            <input type="radio" name="color" value="purple" checked />
            Purple
          </label>

          <label>
            <input type="radio" name="color" value="blue" />
            Blue
          </label>

          <label>
            <input type="radio" name="color" value="random" />
            Random
          </label>
        </div>

        <!-- DESIGN -->

        <div class="custom-section">
          <h3>Select Design</h3>

          <label>
            <input type="radio" name="design" value="stripes" checked />
            Stripes
          </label>

          <label>
            <input type="radio" name="design" value="dots" />
            Dots
          </label>

          <label>
            <input type="radio" name="design" value="random" />
            Random
          </label>
        </div>

        <!-- PRICE -->

        <div class="custom-section">
          <h3>Select Price</h3>

          <label>
            <input type="radio" name="price" value="149" checked />
            2 Items - ₹149
          </label>

          <label>
            <input type="radio" name="price" value="279" />
            3 Items - ₹279
          </label>
        </div>

        <!-- BUTTON -->

        <button id="cartBtn" class="simple-btn-primary add-cart-btn">
          Add To Cart
        </button>
      </div>
    </div>

    <!--  POPUP  -->

    <div id="popup" class="popup-box">
      <div class="popup-content">
        <h3>Added To Cart</h3>

        <p>Your customized mystery box was added successfully.</p>

        <a href="cart.html" class="simple-btn-primary"> Go To Cart </a>
      </div>
    </div>

    <script src="./js/customize.js"></script>
  </body>
</html>
