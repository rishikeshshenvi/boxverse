<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Box Details</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/box.css" />
  </head>

  <body class="box-page">
    <!--  NAVBAR  -->
    <nav class="navbar navbar-expand-lg simple-navbar sticky-top">
      <div class="container-fluid">
        <!-- LEFT -->
        <button onclick="history.back()" class="back-btn">← Back</button>

        <!-- TOGGLER -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- RIGHT -->
        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
          <a href="./cart.html" class="simple-btn-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-cart3"
              viewBox="0 0 16 16"
            >
              <path
                d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
              />
            </svg>
            Cart
          </a>

          <a href="./history.html" class="simple-btn-outline">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-collection"
              viewBox="0 0 16 16"
            >
              <path
                d="M2.5 3.5a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1zm2-2a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zM0 13a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 16 13V6a1.5 1.5 0 0 0-1.5-1.5h-13A1.5 1.5 0 0 0 0 6zm1.5.5A.5.5 0 0 1 1 13V6a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-.5.5z"
              />
            </svg>
            History
          </a>

          <a href="./index.html" class="simple-btn-logout">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-box-arrow-left"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"
              />
              <path
                fill-rule="evenodd"
                d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"
              />
            </svg>
            Logout
          </a>
        </div>
      </div>
    </nav>

    <!--  MAIN CONTENT  -->

    <div class="main-content">
      <!--  BOX SECTION  -->

      <div class="box-container">
        <!-- IMAGE -->
        <div class="box-image">
          <img src="./assets/box.png" alt="box img" />
        </div>

        <!-- INFO -->
        <div class="box-info">
          <h2 id="boxName"></h2>

          <p>
            <strong>Category:</strong>
            <span id="boxCategory"></span>
          </p>

          <p>
            <strong>Number Of Items:</strong>
            <span id="boxItems"></span>
          </p>

          <p>
            <strong>Possible Items:</strong>
            <span id="boxPossible"></span>
          </p>

          <p>
            <strong>Price:</strong>
            ₹<span id="boxPrice"></span>
          </p>

          <p>
            <strong>Ratings:</strong>
            <span id="boxRating"></span>
          </p>

          <a
            id="customizeBtn"
            href="./customize.html"
            class="simple-btn-primary customize-btn"
          >
            Customize
          </a>
        </div>
      </div>

      <!--  REVIEWS  -->

      <div class="review-section">
        <h3 class="section-title">Customer Reviews</h3>

        <div id="reviewContainer"></div>
      </div>
    </div>

    <!--  FOOTER  -->

    <footer class="simple-footer">
      <h3>BoxVerse</h3>

      <p class="footer-text">
        Discover exciting mystery boxes filled with surprises and rare
        collectibles.
      </p>

      <div class="footer-links">
        <a href="home.html">Home</a>
        <a href="home.html#categories">Categories</a>
        <a href="history.html">History</a>
        <a href="cart.html">Cart</a>
      </div>

      <p class="footer-copy">© 2026 BoxVerse. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./js/config.js"></script>
    <script src="./js/box.js"></script>
  </body>
</html>
